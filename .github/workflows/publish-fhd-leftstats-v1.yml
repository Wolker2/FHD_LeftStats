name: Recover FHD_LeftStats v1 original sources
on:
  push:
    paths:
      - '.github/workflows/publish-fhd-leftstats-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth=1 https://github.com/Xenomorphchyma/SRHD-XenoModKit.git /tmp/SRHD-XenoModKit
      - name: Verify ZIP and export original source
        env:
          PYTHONPATH: /tmp/SRHD-XenoModKit:1FHD_LeftStats_v1_Nexus-GitHub/tools
        run: |
          python '1FHD_LeftStats_v1_Nexus-GitHub/tools/nexus_source_export.py' --archive '1FHD_LeftStats_v1_Nexus-GitHub/install/FHD_LeftStats_v1.zip' --target '1FHD_LeftStats_v1_Nexus-GitHub' --sha256 ff682da589037aaa79bbd15a2f8f50430d4974a5f5ee432f1c148930295391a2 --mod 'FHD_LeftStats'
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '1FHD_LeftStats_v1_Nexus-GitHub/SOURCE' '1FHD_LeftStats_v1_Nexus-GitHub/VALIDATION_REPORT.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Extract FHD_LeftStats v1 original source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
